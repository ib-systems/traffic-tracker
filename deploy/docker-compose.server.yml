services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.12
    container_name: redpanda
    env_file:
      - ${SERVER_ENV_FILE:-.env}
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:19092,external://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:19092,external://${REDPANDA_EXTERNAL_HOST:-localhost}:9092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
      - --set
      - redpanda.superusers=["admin"]
      - --set
      - redpanda.enable_sasl=true
    environment:
      RP_BOOTSTRAP_USER: "admin:${REDPANDA_ADMIN_PASSWORD:-changeme}"
    ports:
      - "9092:9092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "-X", "user=admin", "-X", "pass=${REDPANDA_ADMIN_PASSWORD:-changeme}", "-X", "sasl.mechanism=SCRAM-SHA-256"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.12
    env_file:
      - ${SERVER_ENV_FILE:-.env}
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rpk -X brokers=redpanda:19092 -X user=admin -X pass=${REDPANDA_ADMIN_PASSWORD:-changeme} -X sasl.mechanism=SCRAM-SHA-256 -X admin.hosts=redpanda:9644 acl user create ${AGENT_SASL_USERNAME:-agent} -p ${AGENT_SASL_PASSWORD:-agentpass} --mechanism scram-sha-256 || true
        rpk -X brokers=redpanda:19092 -X user=admin -X pass=${REDPANDA_ADMIN_PASSWORD:-changeme} -X sasl.mechanism=SCRAM-SHA-256 acl create --allow-principal User:${AGENT_SASL_USERNAME:-agent} --operation all --topic '*' --group '*'
        rpk -X brokers=redpanda:19092 -X user=admin -X pass=${REDPANDA_ADMIN_PASSWORD:-changeme} -X sasl.mechanism=SCRAM-SHA-256 topic create --if-not-exists --partitions 1 --replicas 1 --topic-config retention.ms=600000 --topic-config segment.bytes=16777216 port-stats instance-stats disk-stats

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.8.0
    container_name: redpanda-console
    env_file:
      - ${SERVER_ENV_FILE:-.env}
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo \"$$CONSOLE_CONFIG_FILE\" > /tmp/config.yml; /app/console"]
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:19092"]
          sasl:
            enabled: true
            mechanism: SCRAM-SHA-256
            username: admin
            password: ${REDPANDA_ADMIN_PASSWORD:-changeme}
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8080:8080"
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.5
    container_name: clickhouse
    env_file:
      - ${SERVER_ENV_FILE:-.env}
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - ../schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: 262144
    restart: unless-stopped

volumes:
  redpanda-data:
  clickhouse-data:
